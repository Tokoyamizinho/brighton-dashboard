[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brighton-dashboard"
version = "2.0.0"
description = "Web scraping (fontes abertas) + modelagem de dados do Brighton & Hove Albion para um dashboard em Power BI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # fusos horários no Windows (zoneinfo)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brighton = "brighton.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
